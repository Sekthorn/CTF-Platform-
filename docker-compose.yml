# ===================================================
# WebSec CTF - Local Development Docker Compose
# ===================================================
# Usage:
#   docker compose up -d --build
# ===================================================

services:
  # -------------------------------------------------
  # 1. Database (MySQL 8.4)
  # -------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: websec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-websec_ctf}
      MYSQL_USER: ${DB_USER:-websec_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-websec_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - websec-data-net

  # -------------------------------------------------
  # 2. In-Memory Cache (Redis 7.4)
  # -------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: websec-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - websec-data-net

  # -------------------------------------------------
  # 3. Backend REST API (NestJS + Prisma)
  # -------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: websec-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: "mysql://${DB_USER:-websec_user}:${DB_PASSWORD:-websec_password}@mysql:3306/${DB_NAME:-websec_ctf}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-websec_ctf_super_secret_jwt_key_2026_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-websec_ctf_super_secret_refresh_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - websec-app-net
      - websec-data-net

  # -------------------------------------------------
  # 4. Frontend UI (React + Vite + Tailwind + Nginx)
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-WebSec CTF}
    container_name: websec-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - websec-app-net

networks:
  websec-app-net:
    name: websec-app-net
    driver: bridge
  websec-data-net:
    name: websec-data-net
    driver: bridge

volumes:
  mysql_data:
    name: websec_mysql_data
  redis_data:
    name: websec_redis_data
