name: WebSec CTF - CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-ci:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: websec_ctf
          MYSQL_USER: websec_user
          MYSQL_PASSWORD: websec_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "mysql://websec_user:websec_password@127.0.0.1:3306/websec_ctf"
          JWT_SECRET: "ci_jwt_test_secret_key_2026"
        run: npm test --if-present

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile & Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  docker-syntax-check:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Temporary .env
        run: cp .env.example .env

      - name: Validate Development Compose Config
        run: docker compose config

      - name: Validate Production Compose Config
        run: docker compose -f docker-compose.prod.yml config
