# ===================================================
# WebSec CTF - Hardened Production Docker Compose
# ===================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ===================================================

services:
  # -------------------------------------------------
  # 1. Reverse Proxy & Edge Ingress (Nginx)
  # -------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: websec-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - websec-edge-net
      - websec-app-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  # -------------------------------------------------
  # 2. Frontend UI Container (Nginx Alpine)
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: "WebSec CTF"
    container_name: websec-prod-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - websec-app-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # -------------------------------------------------
  # 3. Backend REST API (NestJS + Prisma)
  # -------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: websec-prod-backend
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-websec_ctf_production_jwt_secret_key_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-websec_ctf_production_jwt_refresh_secret_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - websec-app-net
      - websec-data-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # -------------------------------------------------
  # 4. Database (MySQL 8.4 - Strict Internal Access)
  # -------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: websec-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - websec-data-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  # -------------------------------------------------
  # 5. In-Memory Cache (Redis 7.4 - Strict Internal Access)
  # -------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: websec-prod-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - websec-data-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  websec-edge-net:
    name: websec-edge-net
    driver: bridge
  websec-app-net:
    name: websec-app-net
    driver: bridge
  websec-data-net:
    name: websec-data-net
    driver: bridge
    internal: true
  websec-challenge-net:
    name: websec-challenge-net
    driver: bridge

volumes:
  mysql_prod_data:
    name: websec_mysql_prod_data
  redis_prod_data:
    name: websec_redis_prod_data
